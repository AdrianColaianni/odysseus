# Local overlay: llama.cpp server on the RX 5600 XT via Vulkan.
# Compose loads this file on its own. Odysseus reaches the model at
# http://llama:8081/v1 over the compose network; the host at 127.0.0.1:8081.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /home/adrian/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF:/models:ro
    devices:
      # renderD128 is the RX 5600 XT. renderD129 is the Radeon 610M iGPU.
      - /dev/dri/renderD128
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
      - --alias
      - qwen3.6
      - -m
      - /models/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
      - -ngl
      - "99"
      - --n-cpu-moe
      - "40"
      - -c
      - "65536"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - -np
      - "1"
      - --load-mode
      - none
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  odysseus:
    depends_on:
      llama:
        condition: service_started
