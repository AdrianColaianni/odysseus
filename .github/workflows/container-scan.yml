# hadolint lints the Dockerfile. Blocking, and on the broad trigger so the
# required check always reports; the advisory Trivy scan is container-trivy.yml.

name: Container scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: Dockerfile
          # DL3008: pinning apt package versions is impractical on a -slim base
          # image. Debian purges old package versions from its repos, so a
          # pinned version breaks future rebuilds. The base image itself is
          # what should be pinned (tracked by Dependabot's docker ecosystem).
          ignore: DL3008
